<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tugas</title>
</head>
<body>
    <h1>Daftar Tugas</h1>

    {% if tasks %}
        <ul>
            {% for task in tasks %}
                <li>
                    <strong>{{ task.title }}</strong>

                    {% if task.description %}
                        <p>{{ task.description }}</p>
                    {% endif %}

                    {% if task.completed %}
                        <span>Selesai</span>
                    {% else %}
                        <span>Belum selesai</span>
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Belum ada tugas.</p>
    {% endif %}
</body>
</html>
